services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:3000
    # Africa's Talking credentials for SMS and USSD (optional; see backend/.env.example).
    env_file:
      - path: ./backend/.env
        required: false

  frontend:
    build:
      context: ./frontend
      args:
        # Read by the browser, so it must be an address the browser can reach.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_USE_MOCK: "false"
    ports:
      - "3000:3000"
    depends_on:
      - backend
